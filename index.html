<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo - Login / Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-column: column;
            position: relative;
        }
        @media (min-width: 420px) {
            .app-container {
                min-height: 90vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }
        .header-banner {
            background: linear-gradient(135deg, #fb4e4e, #d82c2c);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }
        .brand-logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .banner-subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .form-container {
            padding: 30px 24px;
            flex-grow: 1;
        }
        .nav-tabs {
            border-bottom: none;
            margin-bottom: 25px;
        }
        .nav-link {
            border: none !important;
            color: #6c757d;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 10px 0;
            margin-right: 25px;
            position: relative;
        }
        .nav-link.active {
            color: #fb4e4e !important;
            background: transparent !important;
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #fb4e4e;
            border-radius: 2px;
        }
        .input-group-text {
            background: transparent;
            border-right: none;
            color: #adb5bd;
        }
        .form-control {
            border-left: none;
            padding: 12px;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
        .input-group:focus-within .input-group-text {
            color: #fb4e4e;
            border-color: #fb4e4e;
        }
        .input-group:focus-within .form-control {
            border-color: #fb4e4e;
        }
        .btn-primary {
            background: linear-gradient(135deg, #fb4e4e, #d82c2c);
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(251, 78, 78, 0.3);
            transition: all 0.2s ease;
        }
        .btn-primary:hover, .btn-primary:active {
            background: linear-gradient(135deg, #e03d3d, #c22222) !important;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="app-container d-flex flex-column">
    <div class="header-banner">
        <div class="brand-logo"><i class="fa-solid fa-gamepad me-2"></i>WINGO</div>
        <div class="banner-subtitle">Predict & Win • Serverless Sandbox Game</div>
    </div>
    
    <div class="form-container">
        <!-- Tabs Toggle -->
        <ul class="nav nav-tabs" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Register</button>
            </li>
        </ul>
        
        <div class="tab-content" id="authTabsContent">
            <!-- Login Form Panel -->
            <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                <form id="loginForm">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="loginUser" placeholder="Enter Username / Mobile" required>
                    </div>
                    <div class="input-group mb-4">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="loginPass" placeholder="Enter Password" required>
                    </div>
                    <div id="loginAlert" class="alert alert-danger d-none py-2 text-center" role="alert"></div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
                </form>
            </div>
            
            <!-- Register Form Panel -->
            <div class="tab-pane fade" id="register-panel" role="tabpanel">
                <form id="registerForm">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="regUser" placeholder="Enter Username / Mobile" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="regPass" placeholder="Set Password" required>
                    </div>
                    <div class="input-group mb-4">
                        <span class="input-group-text"><i class="fa-solid fa-user-tag"></i></span>
                        <input type="text" class="form-control" id="regRef" placeholder="Referral Code (Optional)">
                    </div>
                    <div id="regAlert" class="alert alert-danger d-none py-2 text-center" role="alert"></div>
                    <div id="regSuccessAlert" class="alert alert-success d-none py-2 text-center" role="alert"></div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase Helper Initialization -->
<script src="firebase-config.js"></script>
<script>
    // Handle Registration Submit
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value;
        const refcode = document.getElementById('regRef').value.trim();
        
        const alertEl = document.getElementById('regAlert');
        const successEl = document.getElementById('regSuccessAlert');
        alertEl.classList.add('d-none');
        successEl.classList.add('d-none');
        
        // Fetch if user already exists
        const userCheck = await firebaseRequest(`users/${username}`);
        if (userCheck) {
            alertEl.innerText = "Username already exists!";
            alertEl.classList.remove('d-none');
            return;
        }
        
        // Helper to generate code
        const usercode = 'WINGO' + Math.floor(100000 + Math.random() * 900000);
        
        // Save user profile node
        const newUser = {
            username: username,
            password: password,
            usercode: usercode,
            refcode: refcode,
            balance: 20, // Welcome bonus of ₹20
            bonus: 0,
            hold: 0,
            notice: "Welcome to Wingo serverless game platform!",
            status: "active"
        };
        
        const result = await firebaseRequest(`users/${username}`, 'PUT', newUser);
        if (result) {
            successEl.innerText = "Registered successfully! Toggle tab to Login.";
            successEl.classList.remove('d-none');
            document.getElementById('registerForm').reset();
        } else {
            alertEl.innerText = "Something went wrong. Please try again.";
            alertEl.classList.remove('d-none');
        }
    });

    // Handle Login Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;
        
        const alertEl = document.getElementById('loginAlert');
        alertEl.classList.add('d-none');
        
        const userData = await firebaseRequest(`users/${username}`);
        if (!userData) {
            alertEl.innerText = "Username not found. Please register.";
            alertEl.classList.remove('d-none');
            return;
        }
        
        if (userData.status === 'blocked') {
            alertEl.innerText = "Account blocked. Contact administrator.";
            alertEl.classList.remove('d-none');
            return;
        }
        
        if (userData.password !== password) {
            alertEl.innerText = "Password incorrect. Please check.";
            alertEl.classList.remove('d-none');
            return;
        }
        
        // Success: save user session & redirect
        localStorage.setItem('wingo_user', username);
        window.location.href = 'game.html';
    });
</script>
</body>
</html>
